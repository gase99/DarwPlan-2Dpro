name: Android debug APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      # Use the runner's installed SDK without depending on sdkmanager being on PATH.
      - name: Install Android platform
        shell: bash
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          if [ -d "$sdk/platforms/android-35" ] && [ -d "$sdk/build-tools/35.0.0" ]; then
            echo "Android 35 is already installed."
            exit 0
          fi
          manager=$(find "$sdk/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$manager" ]; then
            echo "::error title=Android SDK missing::ANDROID_HOME=$sdk; SDK contents: $(ls -m "$sdk" 2>&1)"
            exit 1
          fi
          set +e
          "$manager" --sdk_root="$sdk" "platforms;android-35" "build-tools;35.0.0" > "$RUNNER_TEMP/sdk.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/sdk.log"
          if [ "$result" -ne 0 ]; then
            message=$(tail -30 "$RUNNER_TEMP/sdk.log")
            message="${message//'%'/'%25'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=SDK installation failed::$message"
          fi
          exit "$result"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test, lint and assemble
        run: bash .github/scripts/gradle-check.sh testDebugUnitTest lintDebug assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CabinetPlan-FA-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-quality-reports
          path: |
            app/schemas/
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
