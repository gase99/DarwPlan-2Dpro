name: Android release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 or v0.1.0-preview.1'
        required: true
        default: 'v0.1.0-preview.1'

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  native-tests:
    uses: ./.github/workflows/android-device-test.yml
  release:
    needs: native-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate tag and distinguish preview from production
        id: version
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]; then
            echo "::error::Unsupported release tag."
            exit 1
          fi
          echo "CABINET_VERSION=${TAG#v}" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-preview.* ]]; then
            echo "preview=true" >> "$GITHUB_OUTPUT"
            echo "CABINET_VERSION_CODE=2" >> "$GITHUB_ENV"
          else
            echo "preview=false" >> "$GITHUB_OUTPUT"
            echo "CABINET_VERSION_CODE=3" >> "$GITHUB_ENV"
          fi
      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test preview (debug signature, explicitly not production)
        if: steps.version.outputs.preview == 'true'
        run: bash .github/scripts/gradle-check.sh testDebugUnitTest lintDebug assembleDebug
      - name: Build and test production (private signing secrets required)
        if: steps.version.outputs.preview == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.CABINET_KEYSTORE_BASE64 }}
          CABINET_STORE_PASSWORD: ${{ secrets.CABINET_STORE_PASSWORD }}
          CABINET_KEY_ALIAS: ${{ secrets.CABINET_KEY_ALIAS }}
          CABINET_KEY_PASSWORD: ${{ secrets.CABINET_KEY_PASSWORD }}
          CABINET_STORE_TYPE: ${{ vars.CABINET_STORE_TYPE || 'JKS' }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$CABINET_STORE_PASSWORD" ] || [ -z "$CABINET_KEY_ALIAS" ] || [ -z "$CABINET_KEY_PASSWORD" ]; then
            echo "::error::Production signing secrets are missing. Refusing to publish an unsigned or debug-signed stable APK."
            exit 1
          fi
          export CABINET_KEYSTORE_PATH="$RUNNER_TEMP/cabinet-release.keystore"
          trap 'rm -f "$CABINET_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CABINET_KEYSTORE_PATH"
          chmod 600 "$CABINET_KEYSTORE_PATH"
          bash .github/scripts/gradle-check.sh testDebugUnitTest lintDebug lintRelease assembleRelease
      - name: Verify APK signature and package downloads
        env:
          PREVIEW: ${{ steps.version.outputs.preview }}
        shell: bash
        run: |
          if [ "$PREVIEW" = true ]; then
            apk=app/build/outputs/apk/debug/app-debug.apk
          else
            apk=app/build/outputs/apk/release/app-release.apk
          fi
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release
          cp "$apk" "release/CabinetPlan-FA-$TAG.apk"
          (cd release && sha256sum "CabinetPlan-FA-$TAG.apk" > SHA256SUMS.txt)
      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ steps.version.outputs.preview }}
        shell: bash
        run: |
          # Never overwrite assets attached to a different source commit.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::Tag points to a different commit; refusing to replace its release."
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$PREVIEW" = true ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
                --title "کابینت‌پلن $TAG — نسخهٔ آزمایشی" \
                --notes "نسخهٔ آزمایشی قابل نصب با امضای Debug؛ نسخهٔ پایدار نیست. رسم و Snap، کتابخانهٔ فارسی، ویرایش گروهی، واگرد/بازانجام، ذخیرهٔ محلی و خروجی PNG/PDF دارد. آزمون‌های خودکار و Lint در GitHub Actions اجرا شده‌اند؛ آزمایش روی گوشی واقعی همچنان توصیه می‌شود. برای نصب، فایل APK را از Assets بگیرید. در صورت تعارض امضا با نسخهٔ قبلی، حذف اپ تمام داده‌های محلی را پاک می‌کند؛ ابتدا خروجی‌های لازم را نگه دارید."
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "کابینت‌پلن $TAG" \
                --notes "نسخهٔ امضاشدهٔ کابینت‌پلن. فایل APK را از Assets دریافت و روی اندروید ۸ یا بالاتر نصب کنید. همهٔ داده‌های طرح محلی هستند. خروجی‌های PNG و PDF از داخل اپ قابل ذخیره‌اند."
            fi
          fi
          gh release upload "$TAG" "release/CabinetPlan-FA-$TAG.apk" release/SHA256SUMS.txt --clobber
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-quality-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
